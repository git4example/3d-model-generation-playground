apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: 3d-inferencing
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "{{ .Values.env.nodeEnv }}"
        - name: PORT
          value: "{{ .Values.env.port }}"
        - name: TRIPOSR_SERVICE_URL
          value: "{{ .Values.env.triposrServiceUrl }}"
        - name: STABLE3DGEN_SERVICE_URL
          value: "{{ .Values.env.stable3dgenServiceUrl }}"
        - name: DIRECT3DS2_SERVICE_URL
          value: "{{ .Values.env.direct3ds2ServiceUrl }}"
        - name: ASSET_MANAGER_SERVICE_URL
          value: "{{ .Values.env.assetManagerServiceUrl }}"
        - name: K8S_NAMESPACE
          value: "{{ .Values.env.k8sNamespace }}"
        - name: SERVICE_PORT
          value: "{{ .Values.env.servicePort }}"
        - name: NEXT_PUBLIC_API_BASE_URL
          value: "{{ .Values.env.nextPublicApiBaseUrl }}"
        resources:
          requests:
            memory: 512Mi
            cpu: "500m"
          limits:
            memory: 1Gi
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: 3d-inferencing
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
