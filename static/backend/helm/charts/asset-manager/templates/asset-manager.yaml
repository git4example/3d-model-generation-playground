apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-manager
  namespace: 3d-inferencing
  labels:
    app: asset-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asset-manager
  template:
    metadata:
      labels:
        app: asset-manager
    spec:
      serviceAccountName: 3d-model-sa
      containers:
      - name: asset-manager
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: ROOT_PATH
          value: "/asset-manager"
        - name: S3_BUCKET
          value: {{ .Values.env.s3Bucket | quote }}
        - name: DYNAMODB_TABLE_NAME
          value: {{ .Values.env.dynamodbTable | quote }}
        - name: AWS_REGION
          value: {{ .Values.env.awsRegion | quote }}
        resources:
          requests:
            memory: 256Mi
            cpu: "250m"
          limits:
            memory: 512Mi
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: asset-manager-service
  namespace: 3d-inferencing
  labels:
    app: asset-manager
spec:
  type: ClusterIP
  selector:
    app: asset-manager
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
