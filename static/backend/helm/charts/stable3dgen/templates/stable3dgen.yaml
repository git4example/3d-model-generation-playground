apiVersion: apps/v1
kind: Deployment
metadata:
  name: stable3dgen
  namespace: 3d-inferencing
  labels:
    app: stable3dgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stable3dgen
  template:
    metadata:
      labels:
        app: stable3dgen
    spec:
      serviceAccountName: 3d-model-sa
      nodeSelector:
        node.kubernetes.io/instance-type: g5.2xlarge
      tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: "true"
        effect: NoSchedule
      containers:
      - name: model
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: ROOT_PATH
          value: {{ .Values.env.rootPath | quote }}
        - name: S3_BUCKET
          value: {{ .Values.env.s3Bucket | quote }}
        - name: DYNAMODB_TABLE_NAME
          value: {{ .Values.env.dynamodbTable | quote }}
        - name: AWS_REGION
          value: {{ .Values.env.awsRegion | quote }}
        resources:
          requests:
            memory: 24Gi
            cpu: "6"
            nvidia.com/gpu: 1
          limits:
            memory: 28Gi
            cpu: "7"
            nvidia.com/gpu: 1
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 240
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 180
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: stable3dgen-service
  namespace: 3d-inferencing
  labels:
    app: stable3dgen
spec:
  type: ClusterIP
  selector:
    app: stable3dgen
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
